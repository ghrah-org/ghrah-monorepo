[project]
name = "ghrah-subject"
version = "0.2.0a0"
description = "ghrah 控制面/执行层 - 持有工作区、执行沙箱命令、持久化 ActionChain、裁决 HITL"
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = [
    "ghrah-core>=0.2.0a0",
    "ghrah-plugin>=0.1.0a0",
    "ghrah-protocol>=0.2.0a0",
    "ghrah-taskstore>=0.1.0a0",
    "cordis-ouroboros>=0.2.0",
    "aiosqlite>=0.20",
    "agentconf>=0.4.0,<0.5",
    "websockets>=12.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.34.0",
]
authors = [
    {name = "chenxya", email = "chenxya@ghrah.org"},
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[project.scripts]
ghrah-subject = "ghrah.subject.app:main"
ghrah-subject-server = "ghrah.subject.server.app:main"
ghrah-subject-runtime = "ghrah.subject.runtime_http:main"
subject = "ghrah.subject.cli:main"

[project.entry-points."ghrah.subject.units"]
# ⚠️ 内置 Unit 用 register_builtin_units() 显式注册（调试友好），此处留空。
# 第三方 Unit 通过此 group 注册为**候选**：engine.discover() 发现，
# 但需 config.enabled_third_party_units allowlist 显式启用才会加载。
# 发现≠启用，Subject 是高权限 effect host，第三方默认不启用。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
strict = true

[tool.hatch.build.targets.sdist]
exclude = [
    "/.python-version",
    "/main.py",
    "/.kilo",
    "/plans",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
]
