[project]
name = "ghrah-kernel"
version = "0.1.0a0"
description = "应用微内核、监督者与结构化消息 SDK"
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = ["cbor2>=5.6"]
authors = [
  {name = "chenxya", email = "chenxya@ghrah.org"}
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[project.optional-dependencies]
agent = ["ghrah-core>=0.2.0a0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah_kernel"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
