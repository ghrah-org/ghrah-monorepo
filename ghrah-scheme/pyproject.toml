[project]
name = "ghrah-scheme"
version = "0.1.0a0"
description = "ghrah 自用的类型化 Scheme 与控制平面原语"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "ghrah-protocol>=0.2.0a0"]
authors = [{name = "chenxya", email = "chenxya@ghrah.org"}]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
