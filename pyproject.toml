[project]
name = "ghrah-monorepo"
version = "0.1.0"
description = "ghrah monorepo workspace root"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ghrah-core",
    "ghrah-plugin",
    "ghrah-protocol",
    "ghrah-subject",
    "ghrah-taskstore",
    "aiohttp>=3.13.5",
]

[tool.uv.workspace]
members = [
    "ghrah-core",
    "ghrah-plugin",
    "ghrah-protocol",
    "ghrah-subject",
    "ghrah-taskstore",
]

[tool.uv.sources]
ghrah-core = { workspace = true }
ghrah-plugin = { workspace = true }
ghrah-protocol = { workspace = true }
ghrah-subject = { workspace = true }
ghrah-taskstore = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
