# 这是一份验证性质的草案，用于九夏/ghrah 本身的源码组合
# 现阶段为静态校验，未囊括 Agent 部分

schema = 1

[workspace]
name = "ghrah"
version = "0.2.0"
default_distro = "generic"
native_locks = ["uv.lock", "pnpm-lock.yaml"]

[components.ghrah-kernel]
path = "ghrah-kernel"

[components.ghrah-plugin]
path = "ghrah-plugin"

[components.ghrah-protocol]
path = "ghrah-protocol"

[components.ghrah-scheme]
path = "ghrah-scheme"

[components.ghrah-core]
path = "ghrah-core"

[components.ghrah-taskstore]
path = "ghrah-taskstore"

[components.ghrah-subject]
path = "ghrah-subject"

[components.web-protocol]
path = "ghrah-observer-webui/packages/protocol"

[components.web-plugin-registry]
path = "ghrah-observer-webui/packages/plugin-registry"

[components.web-observer-core]
path = "ghrah-observer-webui/packages/observer-core"

[components.web-observer-web]
path = "ghrah-observer-webui/packages/observer-web"

[distro.generic]
components = ["ghrah-kernel", "ghrah-plugin", "ghrah-protocol", "ghrah-scheme", "ghrah-core", "ghrah-taskstore", "ghrah-subject", "web-protocol", "web-plugin-registry", "web-observer-core", "web-observer-web"]
roots = ["subject/host"]
gate = "basic"

[distro.generic.runtime]
python = ">=3.15.1"
node = ">=22.12"

[distro.generic.instances.subject]
component = "ghrah-subject"
host = "process"
# 宿主入口由此声明并写入代内 catalog，运行时只读取代内产物。
host_entry = "subject/host"

# 系统声明：catalog 的 host/kernel/services 三段都由这里选出。
# 想产出 catalog 的构建必须显式声明本节，缺了就是 E-CAT-SYSTEM。
[distro.generic.system]
host_instance = "subject"
kernel = "ghrah-kernel"

# 每个已启用的 provider 恰有一条绑定记录；id 形如 <组件>:<provider 键>。
# principal 只能由部署者在此指派，包作者的 component.toml 写不了，也会被拒。
[[distro.generic.system.providers]]
id = "ghrah-kernel:namespace"
principal = '["local","ns"]'

[distro.generic.identity]
grant_lifetime = { mode = "instance" }
subjects = [
    { issuer = "local", subject_id = "admin", kind = "user" },
    { issuer = "local", subject_id = "ns", kind = "service" },
]
groups = []
namespaces = [{ namespace_id = "main", owner = '["local","admin"]' }]
scopes = [{
    scope_id = "main",
    namespaces = ["main"],
    subjects = ['["local","admin"]', '["local","ns"]'],
}]
access = []

# 当前没有声明已落地的 Ability scheme 服务，避免虚构运行时契约。
[distro.generic.services]

[distro.generic.namespaces]

[profile.dev]
mode = "dev"

[profile.test]
mode = "test"

[profile.release]
mode = "release"
locked = true
