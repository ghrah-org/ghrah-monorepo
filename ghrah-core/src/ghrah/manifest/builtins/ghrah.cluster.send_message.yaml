manifest: ability
version: "1"
metadata:
  namespace: ghrah.cluster
  name: send_message
  title: Send Message
  description: Prepare a persistent request to another agent. Delivery starts after commit. By default replies arrive through the persistent mailbox; fire_and_forget=false waits after a durable checkpoint.
  tags: [cluster, communication]
  permissions: {}
tool:
  name: send_message
  description: Prepare a persistent request to another agent. Delivery starts after commit. By default replies arrive through the persistent mailbox; fire_and_forget=false waits after a durable checkpoint.
  parameters:
    target:
      type: string
      description: Target agent name to send the message to
      required: true
    content:
      type: string
      description: Message content to send
      required: true
    fire_and_forget:
      type: boolean
      description: If true (default), prepare asynchronous delivery; if false, commit a durable wait checkpoint and return the reply in this tool call.
      required: false
implementation:
  type: builtin
  handler: send_message
