manifest: ability
version: "1"
metadata:
  namespace: ghrah.core
  name: list_abilities
  title: List Abilities
  description: List the abilities available in this deployment (read-only). Results describe declared manifests and registered handlers. Pass full_name for a single entry's detail.
  tags: [core, discovery]
  permissions: {}
tool:
  name: list_abilities
  description: List the abilities available in this deployment (read-only). Results describe declared manifests and registered handlers. Pass full_name for one entry's detail.
  parameters:
    full_name:
      type: string
      description: Optional full name of a single ability to inspect in detail (e.g. 'ghrah.fs.read_file' or 'research'). Omit to list everything.
      required: false
implementation:
  type: builtin
  handler: list_abilities
