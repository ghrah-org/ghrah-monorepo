          type: array
      required:
      - name
      - bound
      type: object
    tags:
    - binding
    - core
    effects: []
    permissions: {}
    resources: {}
    execution:
      mode: request
      timeout_ms: 30000
      cancellation: unsupported
      on_revoke: drain
      retry: never
    expose: true
    path: ghrah/core/operations/unbind_member.py
