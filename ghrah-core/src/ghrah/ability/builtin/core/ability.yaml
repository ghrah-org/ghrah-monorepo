- namespace: ghrah
  name: core
  member: ghrah.core.load_skill
  type: operation
  version: null
  ability_type: kernel
  axes:
    visible: true
    bind: true
  data:
    title: Load Skill
    description: Load the complete text of a granted Skill by its exact alias/skill catalog name. Pass path to read a granted text attachment relative to that Skill. Content comes from the committed version; returned paths are package-relative.
    input_schema:
      additionalProperties: false
      properties:
        full_name:
          description: Exact alias/skill name from the available-skills catalog.
          minLength: 1
          type: string
        path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Optional registered attachment path relative to the Skill document, for example references/style.md. Omit to load the complete Skill document.
      required:
      - full_name
      type: object
    output_schema:
      additionalProperties: false
      properties:
        full_name:
          description: alias/skill that was loaded
          type: string
        instance_id:
          description: Instance that owns the committed text
          type: string
        version_digest:
          description: Committed version digest
          type: string
        member:
          description: Member address of the document or attachment
          type: string
        path:
          description: Package-relative path
          type: string
        media_type:
          description: Media type
          type: string
        digest:
          description: Content digest
          type: string
        total_bytes:
          description: Total size in bytes
          type: integer
        alias:
          description: Package alias
          type: string
        uri:
          description: 'ability: alias/member URI'
          type: string
        content:
          description: UTF-8 text
          type: string
      required:
      - full_name
      - instance_id
      - version_digest
      - member
      - path
      - media_type
      - digest
      - total_bytes
      - alias
      - uri
      - content
      type: object
    tags:
    - core
    - skill
    effects: []
    permissions: {}
    resources: {}
    execution:
      mode: request
      timeout_ms: 60000
      cancellation: unsupported
      on_revoke: drain
      retry: never
    expose: true
    path: ghrah/core/operations/load_skill.py
- namespace: ghrah
  name: core
  member: ghrah.core.recall_context
  type: operation
  version: null
  ability_type: kernel
  axes:
    visible: true
    bind: true
  data:
    title: Recall Context
    description: Recall original messages from the current-branch action-chain history, including nodes summarized away by compaction.
    input_schema:
      additionalProperties: false
      properties:
        mode:
          default: list
          description: 'list: summarize nodes on the current branch; messages: fetch original messages of the selected nodes'
          enum:
          - list
          - messages
          type: string
        node_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Target a single node on the current branch (exclusive with node_id_range)
        node_id_range:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          description: Inclusive [from_id, to_id] range of node ids on the current branch
        keyword:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Case-insensitive substring filter over message text
        role:
          anyOf:
          - enum:
            - system
            - user
            - ai
            - tool
            type: string
          - type: 'null'
          default: null
          description: Filter messages by role
        since_iteration:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          description: Only nodes with iteration >= this value
        limit:
          default: 20
          description: Max number of nodes returned (most recent first)
          maximum: 500
          minimum: 1
          type: integer
        max_output_tokens:
          default: 2000
          description: Output budget; recall stops and sets truncated=True when exceeded
          minimum: 100
          type: integer
      type: object
    output_schema:
      $defs:
        RecallMessageOutput:
          additionalProperties: false
          description: messages 模式里的一条原文。
          properties:
            role:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Message role
            source:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Message source
            text:
              description: Message text
              type: string
          required:
          - text
          type: object
        RecallNodeOutput:
          additionalProperties: false
          description: list 模式的节点概要，或 messages 模式的一组分页原文。
          properties:
            node_id:
              description: Action-chain node id
              type: string
            iteration:
              description: Node iteration
              type: integer
            node_kind:
              description: Node kind, such as action or compact
              type: string
            branch_id:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Branch the node was created on
            timestamp:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: ISO timestamp, in list mode
            ability_names:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              description: Abilities recorded on the node, in list mode
            message_count:
              anyOf:
              - type: integer
              - type: 'null'
              default: null
              description: Messages on the node, in list mode
            summarized_range:
              anyOf:
              - items:
                  type: string
                type: array
              - type: 'null'
              default: null
              description: Original node ids covered by a compact node
            trigger_source:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: What triggered compaction, on a compact node
            degraded:
              anyOf:
              - type: boolean
              - type: 'null'
              default: null
              description: Whether compaction fell back to a folded view
            messages:
              anyOf:
              - items:
                  $ref: '#/$defs/RecallMessageOutput'
                type: array
              - type: 'null'
              default: null
              description: Original messages, in messages mode
          required:
          - node_id
          - iteration
          - node_kind
          type: object
      additionalProperties: false
      properties:
        nodes:
          description: Selected nodes
          items:
            $ref: '#/$defs/RecallNodeOutput'
          type: array
        count:
          description: Number of nodes returned
          type: integer
        truncated:
          description: Whether the node window or token budget cut the result
          type: boolean
      required:
      - nodes
      - count
      - truncated
      type: object
    tags:
    - context
    - core
    effects: []
    permissions: {}
    resources: {}
    execution:
      mode: request
      timeout_ms: 60000
      cancellation: unsupported
      on_revoke: drain
      retry: never
    expose: true
    path: ghrah/core/operations/recall_context.py
- namespace: ghrah
  name: core
  member: ghrah.core.search_tools
  type: operation
  version: null
  ability_type: kernel
  axes:
    visible: true
    bind: true
  data:
    title: Search Tools
    description: List granted tools (operations and MCP members) that are visible but not bound in this Agent instance (axes.visible=true, axes.bind=false). Call bind_member to keep one in context, or execute_tool to call it directly.
    input_schema:
      additionalProperties: false
      properties: {}
      type: object
    output_schema:
      $defs:
        SearchItem:
          additionalProperties: false
          description: 当前可见但未绑定的授予成员。
          properties:
            name:
              description: Exact tool name for describe_tool, execute_tool, or bind_member.
              type: string
            member:
              description: Member full name recorded in the Agent instance snapshot.
              type: string
            package:
              description: Package alias of the member.
              type: string
            title:
              description: Member title.
              type: string
            description:
              description: Member description.
              type: string
            available:
              description: Whether the member backend is currently available.
              type: boolean
          required:
          - name
          - member
          - package
          - title
          - description
          - available
          type: object
      additionalProperties: false
      properties:
        status:
          description: ok, empty, unavailable, not_found, or error.
          type: string
        data:
          description: Visible but unbound granted tools.
          items:
            $ref: '#/$defs/SearchItem'
          type: array
        reason:
          description: Why data is empty, when it is.
          type: string
      required:
      - status
      - data
      - reason
      type: object
    tags:
    - core
    - discovery
    effects: []
    permissions: {}
    resources: {}
    execution:
      mode: request
      timeout_ms: 60000
      cancellation: unsupported
      on_revoke: drain
      retry: never
    expose: true
    path: ghrah/core/operations/search_tools.py
- namespace: ghrah
  name: core
  member: ghrah.core.session_info
  type: operation
  version: null
  ability_type: kernel
  axes:
    visible: true
    bind: true
  data:
    title: Session Info
    description: Read-only introspection of the runtime environment (deployment mode, allowed roots, HITL parameters), current session, and cluster members.
    input_schema:
      additionalProperties: false
      properties: {}
      type: object
    output_schema:
      $defs:
        EnvironmentOutput:
          additionalProperties: false
          description: spawn 装配期写入的部署快照。
          properties:
            deployment:
              description: standalone or subject-mounted
              type: string
            project_id:
              description: Project id; empty when the agent is unattached
              type: string
            workspace_root:
              anyOf:
              - type: string
              - type: 'null'
              description: Workspace root, or null when unset
            default_working_dir:
              anyOf:
              - type: string
              - type: 'null'
              description: Default working directory
            allowed_roots:
              description: Filesystem roots the agent may use
              items:
                type: string
              type: array
            hitl_timeout:
              description: Human-approval timeout in seconds
              type: number
            hitl_consecutive_timeout_limit:
              description: Consecutive approval timeouts allowed
              type: integer
            hitl_degraded_timeout:
              description: Timeout used after the approval limit
              type: number
          required:
          - deployment
          - project_id
          - workspace_root
          - default_working_dir
          - allowed_roots
          - hitl_timeout
          - hitl_consecutive_timeout_limit
          - hitl_degraded_timeout
          type: object
        SessionAgentOutput:
          additionalProperties: false
          description: 当前 Agent 与活动会话。
          properties:
            name:
              description: Agent name
              type: string
            session_id:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Active session id
            active_branch_id:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Active branch id
            session_error:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Why the active session could not be read
            session:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Why session fields are absent when context is not wired
          required:
          - name
          type: object
        SessionClusterMemberOutput:
          additionalProperties: false
          description: 集群成员的公开记录。
          properties:
            agent_id:
              description: Stable agent id
              type: string
            incarnation_id:
              description: Incarnation id
              type: string
            name:
              description: Runtime display name
              type: string
            config:
              anyOf:
              - additionalProperties: true
                type: object
              - type: 'null'
              description: Serializable agent configuration
            description:
              description: Agent description
              type: string
            tags:
              description: Agent tags
              items:
                type: string
              type: array
            created_at:
              description: Registration time as a Unix timestamp
              type: number
          required:
          - agent_id
          - incarnation_id
          - name
          - config
          - description
          - tags
          - created_at
          type: object
        SessionClusterOutput:
          additionalProperties: false
          description: 集群段：列出成员，或在列举失败时只带 error。
          properties:
            members:
              anyOf:
              - items:
                  $ref: '#/$defs/SessionClusterMemberOutput'
                type: array
              - type: 'null'
              default: null
              description: Registered cluster members
            count:
              anyOf:
              - type: integer
              - type: 'null'
              default: null
              description: Number of members
            error:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              description: Why the member list could not be read
          type: object
      additionalProperties: false
      properties:
        environment:
          anyOf:
          - $ref: '#/$defs/EnvironmentOutput'
          - type: 'null'
          description: Spawn-time deployment snapshot, or null when it was not injected
        environment_source:
          description: Where the environment snapshot came from
          type: string
        agent:
          $ref: '#/$defs/SessionAgentOutput'
          description: Current agent and session
        cluster:
          anyOf:
          - $ref: '#/$defs/SessionClusterOutput'
          - type: 'null'
          description: Cluster members, an error object, or null when the supervisor is not wired
      required:
      - environment
      - environment_source
      - agent
      - cluster
      type: object
    tags:
    - core
    - introspection
    effects: []
    permissions: {}
    resources: {}
    execution:
      mode: request
      timeout_ms: 60000
      cancellation: unsupported
      on_revoke: drain
      retry: never
    expose: true
    path: ghrah/core/operations/session_info.py
