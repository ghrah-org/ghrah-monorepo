format: ghrah.ability-definition
schema_version: '2'
identity:
  namespace: ghrah
  name: core
  version: 0.1.0
title: Core
description: Session-level abilities owned by the runtime itself — conversation, task completion, discovery, skill loading, history recall, and introspection.
members:
- namespace: ghrah
  name: core
  member: ghrah.core.bind_member
  type: operation
  version: null
  ability_type: kernel
  axes:
    visible: true
    bind: true
  data:
    title: Bind Member
    description: Bind a granted, visible tool into the model context so its full schema stays available on every turn.
    input_schema:
      additionalProperties: false
      properties:
        name:
          description: Exact tool name returned by search_tools.
          minLength: 1
          type: string
      required:
      - name
      type: object
    output_schema:
      additionalProperties: false
      properties:
        name:
          type: string
        bound:
          items:
            type: string
          type: array
      required:
      - name
      - bound
      type: object
    tags:
    - binding
    - core
    effects: []
    permissions: {}
    resources: {}
    execution:
      mode: request
      timeout_ms: 30000
      cancellation: unsupported
      on_revoke: drain
      retry: never
    expose: true
    path: ghrah/core/operations/bind_member.py
