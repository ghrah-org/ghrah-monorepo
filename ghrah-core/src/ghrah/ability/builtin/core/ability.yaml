format: ghrah.ability-definition
schema_version: '1'
identity: {namespace: ghrah, name: core, version: 0.1.0}
title: Core
description: Session-level abilities owned by the runtime itself — conversation, task
  completion, discovery, skill loading, history recall, and introspection.

# ── 以下由 `ghrah ability build` 生成，勿手改 ──
members:
  operations:
    conversation:
      title: Conversation
      description: Direct conversation with the LLM without tool usage
      entry: operations/conversation.py
      effects: []
    end_task:
      title: End Task
      description: End the current task and generate a final response
      entry: operations/end_task.py
      effects: []
    list_abilities:
      title: List Abilities
      description: List the abilities available in this deployment (read-only). Every row is marked kind='core-ability'
        (declared manifests + registry) or kind='skill-ability' (skill catalog). Pass full_name for a
        single entry's detail.
      entry: operations/list_abilities.py
      effects: []
    load_skill:
      title: Load Skill
      description: Load the full SKILL.md document of one skill (skill-ability) by its exact full name,
        returning the document text and its path. Skills are instruction documents, not invocable abilities.
      entry: operations/load_skill.py
      effects: []
    recall_context:
      title: Recall Context
      description: Recall original messages from the current-branch action-chain history, including nodes
        summarized away by compaction.
      entry: operations/recall_context.py
      effects: []
    session_info:
      title: Session Info
      description: Read-only introspection of the runtime environment (deployment mode, allowed roots,
        HITL parameters), current session, and cluster members.
      entry: operations/session_info.py
      effects: []
