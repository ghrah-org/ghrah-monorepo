format: ghrah.ability-definition
schema_version: '1'
identity: {namespace: ghrah, name: cluster, version: 0.1.0}
title: Cluster
description: Peer discovery, messaging, room delivery, and agent lifecycle inside
  the cluster.

# ── 以下由 `ghrah ability build` 生成，勿手改 ──
members:
  operations:
    broadcast_message:
      title: Broadcast Message
      description: Broadcast a message to all agents in the cluster (excluding the sender) after a durable
        wait checkpoint and collect their replies. Use this for cluster-wide announcements or queries.
      entry: operations/broadcast_message.py
      effects: []
    query_agents:
      title: Query Agents
      description: Query registered agents in the cluster. Returns a list of agent names and descriptions.
        Optionally filter by a substring match on agent name.
      entry: operations/query_agents.py
      effects: []
    query_manifests:
      title: Query Manifests
      description: Read-only query of available agent manifests. Without manifest_ref, lists all manifests;
        with manifest_ref, returns the full definition including its frozen ability list. Use before spawn_agent
        to pick the right manifest.
      entry: operations/query_manifests.py
      effects: []
    send:
      title: Send
      description: Send
      entry: operations/send.py
      effects: []
    send_message:
      title: Send Message
      description: Prepare a persistent request to another agent. Delivery starts after commit. By default
        replies arrive through the persistent mailbox; fire_and_forget=false waits after a durable checkpoint.
      entry: operations/send_message.py
      effects: []
    spawn_agent:
      title: Spawn Agent
      description: Spawn a new peer agent in the cluster by instantiating an agent manifest.
      entry: operations/spawn_agent.py
      effects: []
    terminate_agent:
      title: Terminate Agent
      description: Terminate an agent in the cluster. The agent will be removed and cannot receive further
        messages. Only use this when you are certain the agent is no longer needed.
      entry: operations/terminate_agent.py
      effects: []
