format: ghrah.ability-definition
schema_version: '1'
identity:
  namespace: ghrah
  name: cluster
  version: 0.1.0
title: Cluster
description: Peer discovery, messaging, room delivery, and agent lifecycle inside the cluster.
members:
  operations:
    broadcast_message:
      title: Broadcast Message
      description: Broadcast a message to all agents in the cluster (excluding the sender) after a durable wait checkpoint and collect their replies. Use this for cluster-wide announcements or queries.
      entry: operations/broadcast_message.py
      input_schema:
        additionalProperties: false
        properties:
          content:
            description: Message content to broadcast to all agents
            minLength: 1
            type: string
        required:
        - content
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags:
      - cluster
      - communication
      effects:
      - cluster:message
      permissions: {}
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: true
    query_agents:
      title: Query Agents
      description: Query registered agents in the cluster. Returns a list of agent names and descriptions. Optionally filter by a substring match on agent name.
      entry: operations/query_agents.py
      input_schema:
        additionalProperties: false
        properties:
          filter:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Optional substring to filter agent names
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags:
      - cluster
      - discovery
      effects: []
      permissions: {}
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: true
    query_manifests:
      title: Query Manifests
      description: Read-only query of available agent manifests. Without manifest_ref, lists all manifests; with manifest_ref, returns the full definition including its frozen ability list. Use before spawn_agent to pick the right manifest.
      entry: operations/query_manifests.py
      input_schema:
        additionalProperties: false
        properties:
          manifest_ref:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Optional full name of a single agent manifest to inspect (e.g. 'ghrah.designer'). Omit to list all available manifests.
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags:
      - cluster
      - discovery
      effects: []
      permissions: {}
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: true
    send:
      title: Send
      description: Send a message to rooms. Recipients are all agent members of the given rooms plus optional direct targets. The message is appended to each room's log and delivered via the supervisor.
      entry: operations/send.py
      input_schema:
        additionalProperties: false
        properties:
          room_ids:
            description: Room ids to send the message to (members are resolved as recipients)
            items:
              type: string
            minItems: 1
            type: array
          message:
            description: Message content to send
            minLength: 1
            type: string
          targets:
            anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
            default: null
            description: Optional extra direct targets (agent names) in addition to the room members
        required:
        - room_ids
        - message
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags: []
      effects:
      - cluster:message
      permissions: {}
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: false
    send_message:
      title: Send Message
      description: Prepare a persistent request to another agent. Delivery starts after commit. By default replies arrive through the persistent mailbox; fire_and_forget=false waits after a durable checkpoint.
      entry: operations/send_message.py
      input_schema:
        additionalProperties: false
        properties:
          target:
            description: Target agent name or stable ID
            minLength: 1
            type: string
          content:
            description: Message content to send
            minLength: 1
            type: string
          fire_and_forget:
            default: true
            description: If false, return the durable reply in this tool call
            type: boolean
        required:
        - target
        - content
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags:
      - cluster
      - communication
      effects:
      - cluster:message
      permissions: {}
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: true
    spawn_agent:
      title: Spawn Agent
      description: Spawn a new peer agent in the cluster by instantiating an agent manifest.
      entry: operations/spawn_agent.py
      input_schema:
        additionalProperties: false
        properties:
          manifest_ref:
            description: Manifest reference of the agent template to instantiate
            minLength: 1
            type: string
          name:
            default: ''
            description: Optional runtime name override for the new agent (defaults to the manifest-defined name)
            type: string
          description:
            default: ''
            description: Optional description override for the new agent
            type: string
          system_prompt:
            default: ''
            description: Optional system prompt override for the new agent
            type: string
        required:
        - manifest_ref
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags:
      - cluster
      - lifecycle
      effects:
      - cluster:lifecycle
      permissions:
        require_hitl: true
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: true
    terminate_agent:
      title: Terminate Agent
      description: Terminate an agent in the cluster. The agent will be removed and cannot receive further messages. Only use this when you are certain the agent is no longer needed.
      entry: operations/terminate_agent.py
      input_schema:
        additionalProperties: false
        properties:
          agent_name:
            description: Name of the agent to terminate
            minLength: 1
            type: string
        required:
        - agent_name
        type: object
      output_schema:
        type: object
        properties: {}
        additionalProperties: false
      tags:
      - cluster
      - lifecycle
      effects:
      - cluster:lifecycle
      permissions:
        require_hitl: true
      resources: {}
      execution:
        mode: request
        timeout_ms: 60000
        cancellation: unsupported
        on_revoke: drain
        retry: never
      expose: true
  skills: {}
