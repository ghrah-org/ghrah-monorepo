name: publish

on:
  push:
    tags:
      - "py/ghrah-core@*"
      - "py/ghrah-protocol@*"
      - "py/ghrah-subject@*"
      - "npm/ghrah-protocol@*"
      - "npm/ghrah-observer-core@*"
      - "vscode/ghrah-vscode-extension@*"

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    if: startsWith(github.ref_name, 'py/')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 路由并校验 tag
        id: route
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#py/}"
          pkg="${ref%@*}"
          version="${ref##*@}"
          case "$pkg" in
            ghrah-core|ghrah-protocol|ghrah-subject) ;;
            *) echo "::error::未知 PyPI 包：$pkg"; exit 1 ;;
          esac
          python3 scripts/check_release_tag.py --target "py/$pkg" --version "$version"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
      - run: uv build --package ${{ steps.route.outputs.pkg }} --out-dir dist
      - run: uvx --from twine==7.0.0 twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: startsWith(github.ref_name, 'npm/')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 路由并校验 tag
        id: route
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#npm/}"
          pkg="${ref%@*}"
          version="${ref##*@}"
          case "$pkg" in
            ghrah-protocol|ghrah-observer-core) ;;
            *) echo "::error::未知 npm 包：$pkg"; exit 1 ;;
          esac
          python3 scripts/check_release_tag.py --target "npm/$pkg" --version "$version"
          echo "scope_pkg=${pkg#ghrah-}" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @ghrah/protocol build
      - run: pnpm --filter @ghrah/observer-core build
        if: steps.route.outputs.scope_pkg == 'observer-core'
      - run: >-
          pnpm --filter @ghrah/${{ steps.route.outputs.scope_pkg }} publish
          --no-git-checks --access public --registry https://registry.npmjs.org

  vscode:
    if: startsWith(github.ref_name, 'vscode/')
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 校验 tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME##*@}"
          python3 scripts/check_release_tag.py \
            --target vscode/ghrah-vscode-extension --version "$version"
      - run: pnpm --dir ghrah-observer-webui/vscode-extension build
      - run: pnpm --dir ghrah-observer-webui/vscode-extension exec vsce ls
      - name: 发布 VS Code 扩展
        run: >-
          pnpm --dir ghrah-observer-webui/vscode-extension exec vsce publish
          --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
