name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # protocol 与 scheme 保持 strict 零错误；既有包不在本次扩展类型门禁。
      - run: cd ghrah-protocol && MYPYPATH=src uv run mypy --explicit-package-bases -p ghrah.protocol
      - run: cd ghrah-scheme && MYPYPATH=src uv run mypy --explicit-package-bases -p ghrah.scheme
      - run: uv run pytest ghrah-plugin ghrah-protocol ghrah-core ghrah-subject ghrah-taskstore ghrah-scheme
      - name: Scheme 构建与隔离安装
        run: |
          for package in ghrah-plugin ghrah-protocol ghrah-scheme; do
            uv build --package "$package" --out-dir dist/scheme-check
          done
          scheme_wheel_args=()
          for wheel in dist/scheme-check/*.whl; do
            scheme_wheel_args+=(--with "$wheel")
          done
          uv run --isolated --no-project "${scheme_wheel_args[@]}" python -I -c "import importlib.util; import ghrah.scheme; assert importlib.util.find_spec('ghrah.abilities') is None"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 测试消费 workspace 包的 dist；按依赖顺序构建全部直接依赖。
      - run: pnpm --filter @ghrah/protocol build && pnpm --filter @ghrah/plugin-registry build && pnpm --filter @ghrah/observer-core build
      - run: pnpm -r test
      - run: pnpm type-check
      - run: pnpm lint
