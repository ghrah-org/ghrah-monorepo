name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # protocol 与 scheme 保持 strict 零错误；既有包不在本次扩展类型门禁。
      - run: cd ghrah-protocol && MYPYPATH=src uv run mypy --explicit-package-bases -p ghrah.protocol
      - run: cd ghrah-scheme && MYPYPATH=src uv run mypy --explicit-package-bases -p ghrah.scheme
      # 诊断用：跑完打印标记，区分「pytest 自己没退」与「pytest 已退但进程/管道被占」；
      # timeout-minutes 防止挂住时耗到作业级上限，快速失败并保留日志。
      - name: Python 全量测试
        timeout-minutes: 25
        run: |
          uv run pytest ghrah-plugin ghrah-protocol ghrah-core ghrah-subject ghrah-taskstore ghrah-scheme ghrah-kernel \
            -o faulthandler_timeout=120
          echo "::notice::pytest 已返回，退出码 $?"
      - name: 契约漂移检查
        run: uv run python scripts/export_ability_contracts.py --check
      - name: Kernel 独立安装与真实命名服务
        run: |
          uv build --package ghrah-kernel --out-dir dist/kernel-check
          for wheel in dist/kernel-check/*.whl; do
            uv run --isolated --no-project --with "$wheel" python -I scripts/verify_kernel_install.py
          done
      - name: Scheme 构建与隔离安装
        run: |
          for package in ghrah-plugin ghrah-protocol ghrah-scheme; do
            uv build --package "$package" --out-dir dist/scheme-check
          done
          scheme_wheel_args=()
          for wheel in dist/scheme-check/*.whl; do
            scheme_wheel_args+=(--with "$wheel")
          done
          uv run --isolated --no-project "${scheme_wheel_args[@]}" python -I -c "import importlib.util; import ghrah.scheme; assert importlib.util.find_spec('ghrah.abilities') is None"
      - name: Agent 可选依赖与真实宿主隔离安装
        run: |
          for package in ghrah-kernel ghrah-core ghrah-protocol ghrah-plugin; do
            uv build --package "$package" --out-dir dist/agent-check
          done
          agent_wheel_args=()
          for wheel in dist/agent-check/*.whl; do
            agent_wheel_args+=(--with "$wheel")
          done
          uv run --isolated --no-project --with 'ghrah-kernel[agent]' "${agent_wheel_args[@]}" python -I scripts/verify_agent_install.py

  kernel-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # 聚焦验证原生 pipe2 与无 pipe2/容量 fcntl 的 Unix 分支。
      - run: uv run pytest ghrah-kernel -q -W error -o faulthandler_timeout=30

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # 路径、编码、换行与大小写语义的聚焦回归。
      - run: uv run pytest ghrah-core/tests/ability/package ghrah-core/tests/ability/surface -q
      - name: 内置包索引检查
        run: uv run python -m ghrah.ability.tools.build ghrah-core/src/ghrah/ability/builtin/ability-builder --builtin --check
      - name: fixture 索引检查
        run: |
          uv run python -m ghrah.ability.tools.build ghrah-core/tests/ability/package/fixtures/reporting --check
          uv run python -m ghrah.ability.tools.build ghrah-core/tests/ability/package/fixtures/multi-skill --check
          uv run python -m ghrah.ability.tools.build ghrah-core/tests/ability/package/fixtures/builder --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 测试消费 workspace 包的 dist；按依赖顺序构建全部直接依赖（= webui build:deps）。
      - run: pnpm build:deps
      - run: pnpm -r test
      - name: Observer mock 协议与投影联调
        run: node ghrah-observer-webui/packages/observer-core/scripts/e2e-mock-smoke.mjs
      - run: pnpm type-check
      - run: pnpm lint
      # 只跑断言型护栏（盒模型/层顺序/溢出/侧边栏），不跑像素基线：
      # 视觉基线绑定生成机器的字体渲染，跨镜像比较会整片误报。
      - name: Playwright 布局护栏与 mock 流程
        run: |
          pnpm --filter @ghrah/observer-web exec playwright install --with-deps chromium
          pnpm --filter @ghrah/observer-web exec playwright test e2e/guards.spec.ts e2e/mock-flow.spec.ts
      - name: 构建观察端
        run: pnpm --filter @ghrah/observer-web build
