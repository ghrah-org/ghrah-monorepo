name: release-precheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 冻结安装
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile

      - name: Python 质量门禁
        run: |
          uv run ruff check .
          uv run ruff format --check .
          cd ghrah-protocol
          MYPYPATH=src uv run mypy --explicit-package-bases -p ghrah.protocol
          cd ..
          cd ghrah-scheme
          MYPYPATH=src uv run mypy --explicit-package-bases -p ghrah.scheme
          cd ..
          uv run pytest ghrah-plugin ghrah-protocol ghrah-core ghrah-subject ghrah-taskstore ghrah-scheme

      - name: TypeScript 质量门禁
        run: |
          pnpm --filter @ghrah/protocol build
          pnpm --filter @ghrah/observer-core build
          pnpm -r test
          pnpm type-check
          pnpm lint

      - name: REUSE 许可门禁
        run: uvx --from reuse==6.2.0 reuse lint

      - name: 构建并审计全部产物（含内部包）
        run: uv run python scripts/release_dry_run.py --all --out-dir release-dist

      - name: PyPI 元数据门禁
        run: uvx --from twine==7.0.0 twine check release-dist/python/*/*

      - uses: actions/upload-artifact@v4
        with:
          name: ghrah-release-dry-run
          path: release-dist/
          if-no-files-found: error
          retention-days: 7
