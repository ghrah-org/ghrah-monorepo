[project]
name = "ghrah-taskstore"
version = "0.1.0a0"
description = "ghrah 任务归因内核 - tasks/claims/evidence 三表权威、确定性转移与 checker 扩展点宿主"
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = [
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "ghrah-plugin>=0.1.0a0",
]
authors = [
    {name = "chenxya", email = "chenxya@ghrah.org"},
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
strict = true

[tool.hatch.build.targets.sdist]
exclude = [
    "/.python-version",
    "/main.py",
    "/.kilo",
    "/plans",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
]