[project]
name = "ghrah-protocol"
version = "0.2.0a0"
description = "Shared protocol types for ghrah"
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = [
    "ghrah-plugin>=0.1.0a0",
    "pydantic>=2.0",
]
authors = [
  {name = "chenxya", email = "chenxya@ghrah.org"}
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghrah"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
[tool.hatch.build.targets.sdist]
exclude = [
    "/.kilo",
    "/plans",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
]
